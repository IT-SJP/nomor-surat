# QUICK START CONFIGURATION
# File ini berisi template untuk mempermudah setup awal

# ============================================
# STEP 1: GOOGLE SHEET ID
# ============================================
# 1. Buat Google Sheet baru
# 2. Copy URL: https://docs.google.com/spreadsheets/d/COPY_PART_INI/edit
# 3. Paste SHEET_ID di bawah

SHEET_ID=

# Contoh:
# SHEET_ID=1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p

# ============================================
# STEP 2: GOOGLE APPS SCRIPT DEPLOYMENT
# ============================================
# 1. Copy kode dari "Google Apps Script.gs"
# 2. Buka https://script.google.com
# 3. Paste kode, edit SHEET_ID di atas
# 4. Deploy → New deployment → Web app
# 5. Copy Deployment URL berikut:

DEPLOYMENT_URL=https://script.google.com/macros/d/YOUR_DEPLOYMENT_ID/usercall?function=submitForm

# Contoh:
# DEPLOYMENT_URL=https://script.google.com/macros/d/1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o/usercall?function=submitForm

# ============================================
# STEP 3: UPDATE INDEX.JS
# ============================================
# 1. Buka file "index.js"
# 2. Cari baris:
#    const GOOGLE_APPS_SCRIPT_URL = '...';
# 3. Ganti dengan DEPLOYMENT_URL di atas
# 4. Save file

# ============================================
# STEP 4: TESTING
# ============================================
# 1. Buka index.html di browser
# 2. Isi form dengan data dummy:
#    - Jenis Surat: SJP
#    - Kode Perusahaan: PT.TEST.001
#    - Nama Perusahaan: PT Test Indonesia
#    - Kode Tujuan: Jakarta
#    - Bulan: I
#    - Tahun: 2025
#    - Perihal: Test
#    - Tujuan: Testing
#    - Requestor: Test User
#    - Email: test@example.com
#    - Telepon: 081234567890
# 3. Click "Ajukan Request"
# 4. Cek Google Sheet → nomor surat sudah muncul?
# 5. Cek email → email konfirmasi diterima?

# ============================================
# STEP 5: DEPLOYMENT / HOSTING
# ============================================
# Pilih salah satu:

# OPSI A: GitHub Pages (FREE)
# 1. Buat repository di https://github.com
# 2. Upload file: index.html, style.css, index.js
# 3. Settings → Pages → Source: main
# 4. Kunjungi: https://username.github.io/repo-name

# OPSI B: Vercel (FREE)
# 1. Push code ke GitHub
# 2. Login ke https://vercel.com
# 3. Import project → Deploy
# 4. URL otomatis generated

# OPSI C: Netlify (FREE)
# 1. Login ke https://netlify.com
# 2. Drag & drop folder ke browser
# 3. Instant deploy, dapat URL

# OPSI D: Google Sites (FREE, Integrated)
# 1. Buka https://sites.google.com
# 2. Create site
# 3. Insert → Web app
# 4. Embed code HTML lengkap

# ============================================
# SUPPORT & HELP
# ============================================
# Error: "CORS error" atau "Deployment not found"
# → Cek DEPLOYMENT_URL benar
# → Pastikan deployment mode "Web app"
# → Set access "Anyone"

# Error: "Data tidak masuk sheet"
# → Cek SHEET_ID benar
# → Cek sheet tab name = "Form Responses"
# → Run testSubmission() di Apps Script

# Error: "Email tidak terkirim"
# → Approve Gmail permission di Apps Script
# → Cek email domain di sendConfirmationEmail()
# → Check Apps Script logs

